[project]
name = "openeuler-package-governance"
version = "1.0.0"
description = "openEuler RPM package tiered governance: activity, AI portrait, P0/P1/P2 layered upgrade, version-lag, sunset."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "requests>=2.31",
  "PyYAML>=6.0",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10", "types-requests", "types-PyYAML"]

[project.scripts]
pkg-gov-api = "app.server:run"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["frontend", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
mypy_path = "backend"
files = ["backend/app", "scripts"]
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["build/", "dist/"]
