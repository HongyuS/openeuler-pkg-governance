# Governance rules derived from the openEuler package-governance plan.
# These are the deterministic underpinnings for the "AI full-package portrait".

# Compute the Python dependency closure from these seeds when repository
# dependency metadata is available.
python_closure_seeds:
  - "python3"
  - "python3-libs"
  - "python3-py"
  - "python3-setuptools"
  - "python3-pip"
  - "python3-devel"
  - "python3-rpm"
  - "python3-gobject"

# The minimal critical set (P0 wave): align these to the latest release first.
# Mirrors the Fedora critical-path actions "booting" and "getting updates":
# boot stack (grub2) and the package-management stack (rpm/dnf/yum) belong here.
# Databases / virtualization / containers are product deliverables, not the
# minimal system set — they live in P1_base and their delivery is protected by
# the iso_baseline flag (oemaker comps), not by the P0 tier.
P0_critical:
  - "kernel"
  - "kernel-devel"
  - "glibc"
  - "glibc-devel"
  - "glibc-common"
  - "openssl"
  - "openssl-libs"
  - "openssl-devel"
  - "systemd"
  - "systemd-libs"
  - "rpm"
  - "dnf"
  - "yum"
  - "grub2"
  - "bash"
  - "coreutils"
  - "gcc"
  - "gcc-c++"
  - "libgcc"
  - "libstdc++"
  - "zlib"
  - "xz"
  - "bzip2"
  - "sed"
  - "grep"
  - "findutils"
  - "tar"
  - "ca-certificates"
  - "curl"
  - "iproute"
  - "iptables"
  - "nftables"
  - "python3"
  - "python3-libs"
  - "python3-devel"

# Secondary base packages (P1 wave): network / storage / toolchain.
# Plus product-delivery components demoted from P0 (databases / virt / containers).
# At build time this list is also unioned with the base-ISO comps membership
# (iso_baseline from the oemaker lists) — see docs/scoring-v2.md D7/D8.
P1_base:
  - "mariadb"
  - "postgresql"
  - "libvirt"
  - "podman"
  - "containerd"
  - "docker"
  - "openssh"
  - "openssh-server"
  - "openssh-clients"
  - "wget"
  - "rsync"
  - "lvm2"
  - "e2fsprogs"
  - "xfsprogs"
  - "btrfs-progs"
  - "util-linux"
  - "procps-ng"
  - "psmisc"
  - "attr"
  - "acl"
  - "shadow-utils"
  - "sudo"
  - "cronie"
  - "cronie-anacron"
  - "cmake"
  - "ninja-build"
  - "autoconf"
  - "automake"
  - "libtool"
  - "pkgconf"
  - "meson"
  - "perl"
  - "ruby"
  - "java-17-openjdk"
  - "java-1.8.0-openjdk"

# Node.js toolchain the system repo must actively maintain (runtime + package
# managers). nodejs-* modules beyond critical-package dependency are treated
# as development tools and sunset.
node_toolchain:
  - "nodejs"
  - "node"
  - "npm"
  - "pnpm"
  - "yarn"
  - "corepack"
  - "bun"

# Sunset protection: packages inside the base-installation ISO are official
# deliverables (users install them directly, so reverse_deps cannot see the
# usage). Their removal must go through the release-management branch process
# instead of an automatic sunset recommendation.
sunset_protection:
  iso_baseline: true

# Special / unusual packages that must follow an independent fast-update channel.
# Version info for these is fetched from the network rather than the OS repo.
special_packages:
  - name: "google-chrome-stable"
    note: "DevStation (toB primary, toC secondary): upstream latest from network, independent fast-update channel."
  - name: "microsoft-edge-stable"
    note: "DevStation browser: upstream latest from network, independent fast-update channel."
  - name: "code"
    note: "VS Code for DevStation: upstream latest from network."
  - name: "obs-studio"
    note: "Streaming tool: upstream fast-moving minor releases."

# Weighting used to turn a raw monthly activity series into a rolling score.
# The window score is mapped through log1p before normalisation (log scale,
# see docs/scoring-v2.md D1): distro repos are healthy at 0.5-2 monthly units
# (version syncs + CVE patches), a linear scale graded them all D.
activity_weights:
  month_decay: 0.92        # per-month decay; recent months weigh more
  ref_high: 12             # monthly activity units treated as "saturated" on the log scale
  rolling_windows:
    "1": 0.40               # 1-month window weight in the composite score
    "3": 0.30
    "6": 0.20
    "12": 0.10

# Event floors on the activity index (docs/scoring-v2.md D2): a package whose
# repo still received commits recently is alive regardless of the volume.
activity_event_floors:
  b_days: 180              # last commit within this many days -> index at least the B threshold
  c_days: 365              # within this many days -> index at least the C threshold

# Map a normalised activity index (0..1) to a letter grade.
# Calibrated for the log scale: ~0.5 monthly units -> C, ~1.2 -> B, ~2.2 -> A.
activity_grade_bands:
  A: 0.45
  B: 0.30
  C: 0.15
  D: 0.0

# Maintenance effort model (person-days / year).
effort:
  upgrade_person_days_min: 3
  upgrade_person_days_max: 10
  cve_person_days_min: 0.5
  cve_person_days_max: 2.0
  routine_person_days: 2
  # Average annual upgrade cycles per importance tier.
  upgrades_per_year:
    core: 3
    important: 2
    ordinary: 1
  # Reference person-years (for capacity planning narrative).
  reference_person_years:
    core: 0.75
    important: 0.2
    ordinary: 0.075

# Priority bonus for version lag vs the newest downstream baseline
# (docs/scoring-v2.md D4/D5). `degree` is the leading version-segment
# difference between the openEuler and the newest external version.
# `backport_relief` halves the bonus when the package is actively patched in
# the update/EPOL repos (backport model: lagging by design, like SLE/RHEL).
lag_bonus:
  patch: 0.5
  minor: 1.5
  major: 2.5
  backport_relief: 0.5

# Cross-distribution source-name aliases: openEuler source -> downstream source.
# e.g. openEuler's "kernel" source is shipped as "linux" upstream in Ubuntu.
source_aliases:
  kernel: linux
  kernel-devel: linux
  openssl: openssl
  "python3": python3
  postgresql: postgresql
  mariadb: mariadb
